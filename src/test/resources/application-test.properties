# In-memory H2 configuration for automated unit/integration tests
spring.datasource.url=jdbc:h2:mem:campus_maintenance_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=CampusMaintenanceSecretKeyForJWTSigning1234567890TestKeyOnly
jwt.expiration-ms=86400000
